name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate dataset snapshots
        run: python scripts/rebuild_audit_snapshots.py --check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check leaderboard rendering
        run: python scripts/render_leaderboard.py --check
      - name: Check Python syntax
        run: python -m compileall -q src scripts tests
